# Production overrides
wordpress:
  # TLS is on in this profile, so WordPress must generate https URLs.
  wordpressScheme: https

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  ingress:
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"

  persistence:
    size: 10Gi

  mariadb:
    primary:
      persistence:
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
