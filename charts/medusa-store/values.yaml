# MedusaJS store defaults
medusa:
  image:
    repository: medusajs/medusa
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 9000

  admin:
    email: admin@example.com

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: medusa-store.localtest.me
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

storefront:
  image:
    repository: medusajs/medusa-starter-default
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgresql:
  enabled: true
  auth:
    database: medusa
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 125m
        memory: 256Mi
