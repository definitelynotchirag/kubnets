apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-medusa
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: medusa
spec:
  replicas: {{ .Values.medusa.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-medusa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-medusa
        {{- include "medusa-store.labels" . | nindent 8 }}
        app.kubernetes.io/component: medusa
    spec:
      containers:
        - name: medusa
          image: "{{ .Values.medusa.image.repository }}:{{ .Values.medusa.image.tag }}"
          imagePullPolicy: {{ .Values.medusa.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.medusa.port }}
              name: http
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis-master:6379"
            - name: MEDUSA_ADMIN_EMAIL
              value: {{ .Values.medusa.admin.email | quote }}
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.medusa.port | quote }}
          resources:
            {{- toYaml .Values.medusa.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
