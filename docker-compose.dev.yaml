services:
  # --- Kubernetes cluster (k3s in Docker, replaces k3d) ---
  k3s:
    image: rancher/k3s:v1.30.4-k3s1
    command: server --disable=traefik --tls-san=k3s
    privileged: true
    ports:
      - "6443:6443"   # K8s API
      - "80:80"        # Ingress HTTP
      - "443:443"      # Ingress HTTPS
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s-server:/var/lib/rancher/k3s
      - k3s-output:/output
    healthcheck:
      test: ["CMD", "kubectl", "get", "nodes"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Install nginx ingress after k3s is healthy ---
  k3s-init:
    image: rancher/k3s:v1.30.4-k3s1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for kubeconfig..."
        until [ -f /output/kubeconfig.yaml ]; do sleep 2; done
        export KUBECONFIG=/output/kubeconfig.yaml

        # Point kubectl at the k3s service
        sed -i 's|127.0.0.1|k3s|g' /output/kubeconfig.yaml

        echo "Waiting for k3s API..."
        until kubectl get nodes 2>/dev/null; do sleep 3; done

        echo "Installing nginx ingress controller..."
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml

        echo "Waiting for ingress controller..."
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=180s

        echo "k3s init complete!"
    volumes:
      - k3s-output:/output
    depends_on:
      k3s:
        condition: service_healthy

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: urumi
      POSTGRES_PASSWORD: urumi
      POSTGRES_DB: urumi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urumi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- API + Dashboard (single container) ---
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://urumi:urumi@postgres:5432/urumi
      PORT: "3001"
      KUBECONFIG: /k3s-config/kubeconfig.yaml
      STORE_DOMAIN: localtest.me
      HELM_CHART_PATH_WOOCOMMERCE: /app/charts/store
      HELM_CHART_PATH_MEDUSA: /app/charts/medusa-store
      HELM_VALUES_PROFILE: local
      DASHBOARD_PATH: /app/dashboard/dist
      MAX_STORES: "5"
      MAX_CONCURRENT_PROVISIONS: "3"
      NODE_ENV: production
    volumes:
      - k3s-output:/k3s-config:ro
    depends_on:
      postgres:
        condition: service_healthy
      k3s:
        condition: service_healthy

volumes:
  pgdata:
  k3s-server:
  k3s-output:
