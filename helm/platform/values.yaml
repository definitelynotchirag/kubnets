api:
  image:
    repository: urumi-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3001
  env:
    STORE_DOMAIN: localtest.me
    HELM_CHART_PATH: /app/charts/store
    MAX_STORES: "5"
    MAX_CONCURRENT_PROVISIONS: "3"
    NODE_ENV: production

dashboard:
  image:
    repository: urumi-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 80

ingress:
  enabled: true
  className: nginx
  host: urumi.localtest.me
  tls: false

postgresql:
  enabled: true
  auth:
    username: urumi
    password: urumi
    database: urumi
  primary:
    persistence:
      size: 1Gi
