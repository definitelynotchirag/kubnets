apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.fullname" . }}-api
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Must stay at 1 replica: provisioning runs in an in-memory queue inside this process and
  # is not coordinated across replicas. See DESIGN.md ("Scaling") before raising this.
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi.fullname" . }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "urumi.fullname" . }}-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "urumi.fullname" . }}-api
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "urumi.fullname" . }}-config
          env:
            {{- if .Values.api.databaseUrlSecret }}
            # Operator-managed credentials (production): the Secret is created outside Helm,
            # so no password ever appears in values or in this chart's rendered output.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.databaseUrlSecret }}
                  key: DATABASE_URL
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.fullname" . }}-db
                  key: DATABASE_URL
            {{- end }}
            # Provisioning shells out to Helm, which needs writable cache/config/data
            # directories. Keeping them under /tmp is what allows the root filesystem to
            # stay read-only.
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
