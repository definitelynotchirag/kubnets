apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "urumi.fullname" . }}-api
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "urumi.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "urumi.fullname" . }}-api
