apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urumi.fullname" . }}-config
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
data:
  # Rendered from `.Values.api.env` so Helm values and the runtime environment cannot drift.
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  PORT: {{ .Values.api.port | quote }}
  # The API must know which namespace it runs in: store namespaces allow ingress from it so
  # the post-provision readiness probe can reach the storefront Service directly.
  PLATFORM_NAMESPACE: {{ .Release.Namespace | quote }}
  KUBECONFIG: ""
