apiVersion: v1
kind: Secret
metadata:
  name: {{ include "urumi.fullname" . }}-db
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "urumi.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
